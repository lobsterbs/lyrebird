[package]
name = "wasm-baseline"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# The rustls we profile: same pin the patch pipeline unpacks.
rustls = { path = "../../vendor/rustls/rustls", default-features = false, features = ["std", "ring", "tls12"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# On wasm32 the graph needs three switches that no rustls feature reaches.
# epoxy-tls flips all three from its own client crate; features unify, so
# these deps turn them on for the whole graph, this target only.
#   getrandom/js and ring/wasm32_unknown_unknown_js: entropy on wasm.
#   rustls-pki-types/web: gives UnixTime::now() via web-time.
getrandom = { version = "0.2", features = ["js"] }
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }
rustls-pki-types = { version = "1", features = ["web"] }
