name: baseline

on:
  push:
  pull_request:

jobs:
  rustls-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: fetch pinned rustls and apply patches
        run: sh tools/apply-rustls.sh

      - name: add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: capture harness tests (offline, discover all test files)
        run: python3 -m unittest discover -p 'test_*.py' -v
        working-directory: tools/capture

      - name: native check (rustls, ring provider)
        run: cargo check -p rustls --no-default-features --features std,ring,tls12
        working-directory: vendor/rustls

      - name: probe check (handshake-probe)
        run: cargo check
        working-directory: crates/handshake-probe

      - name: probe order-data tests
        run: cargo test
        working-directory: crates/handshake-probe

      - name: probe release build (the binary all captures are taken with)
        run: cargo build --release
        working-directory: crates/handshake-probe

      - name: wasm32 check (rustls, ring provider)
        run: cargo check --target wasm32-unknown-unknown
        working-directory: crates/wasm-baseline
