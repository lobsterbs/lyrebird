name: baseline

on:
  push:
  pull_request:

jobs:
  rustls-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: fetch pinned rustls and apply patches
        run: sh tools/apply-rustls.sh

      - name: add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: native check (rustls, ring provider)
        run: cargo check -p rustls --no-default-features --features std,ring,tls12
        working-directory: vendor/rustls

      - name: wasm32 check (rustls, ring provider)
        run: cargo check --target wasm32-unknown-unknown -p rustls --no-default-features --features std,ring,tls12
        working-directory: vendor/rustls
        env:
          # getrandom 0.2 (pulled by ring) refuses wasm32-unknown-unknown by
          # default; epoxy-tls picks the wasm_js backend with the same cfg.
          RUSTFLAGS: --cfg getrandom_backend="wasm_js"
